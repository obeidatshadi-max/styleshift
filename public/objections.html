<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="StyleShift Iraqi Objection Bank: live capture of real pharma objections in Iraqi dialect, by Social Style, for the StyleShift workshop.">
<meta name="robots" content="noindex">
<title>Iraqi Objection Bank · StyleShift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Libre+Franklin:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#f6f1e9; --ink:#241c14; --ink-soft:#5c5347; --line:#ded2bd; --card:#fffdf8;
  --driver:#b5402a; --driver-soft:#f4ded7;
  --expressive:#c9821e; --expressive-soft:#f5e3c6;
  --amiable:#3f7d5c; --amiable-soft:#dcece2;
  --analytical:#33628f; --analytical-soft:#dbe6f0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c1712; --ink:#f2ece0; --ink-soft:#b7ab98; --line:#3c3327; --card:#26201a;
    --driver:#e0705a; --driver-soft:#3a2420;
    --expressive:#e0a94f; --expressive-soft:#3a2f18;
    --amiable:#6fbb92; --amiable-soft:#1f3327;
    --analytical:#7aa8d4; --analytical-soft:#1e2c3a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Libre Franklin',system-ui,sans-serif;
  padding-inline:16px; padding-block:28px 60px;
  padding-top:max(28px,env(safe-area-inset-top,0px));
}
.wrap{max-width:880px;margin:0 auto}
.brand{font-size:.8rem;color:var(--ink-soft);text-decoration:none;font-weight:600;letter-spacing:.02em}
.brand:hover{color:var(--ink)}
header.page{margin-bottom:28px}
h1{font-family:'Zilla Slab',Georgia,serif;font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;margin:6px 0;text-wrap:balance}
.sub{color:var(--ink-soft);font-size:.95rem;max-width:60ch;line-height:1.5}
.status-line{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.82rem;color:var(--ink-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amiable);flex:none}
.dot.off{background:var(--driver)}

form.add{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px; display:flex; flex-direction:column; gap:14px; margin-bottom:32px;
}
.styles-row{display:flex;flex-wrap:wrap;gap:8px}
.style-pill{
  border:1.5px solid var(--line); background:transparent; color:var(--ink-soft);
  padding:7px 14px; border-radius:999px; font-size:.85rem; font-weight:600; cursor:pointer;
  font-family:'Libre Franklin',sans-serif; transition:background .15s,color .15s,border-color .15s;
}
.style-pill[data-active="true"][data-style="driver"]{background:var(--driver);border-color:var(--driver);color:#fff}
.style-pill[data-active="true"][data-style="expressive"]{background:var(--expressive);border-color:var(--expressive);color:#241c14}
.style-pill[data-active="true"][data-style="amiable"]{background:var(--amiable);border-color:var(--amiable);color:#fff}
.style-pill[data-active="true"][data-style="analytical"]{background:var(--analytical);border-color:var(--analytical);color:#fff}

label.field{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--ink-soft);font-weight:600}
textarea,input[type=text]{
  font-family:'Tajawal','Libre Franklin',sans-serif; font-size:1rem; color:var(--ink);
  background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:10px 12px; resize:vertical;
}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--analytical);outline-offset:1px}
textarea.ar{min-height:76px;direction:rtl;text-align:right;font-size:1.05rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two-col{grid-template-columns:1fr}}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--ink-soft);font-weight:500}
button.submit{
  background:var(--ink); color:var(--paper); border:none; padding:10px 20px; border-radius:9px;
  font-weight:600; font-size:.9rem; cursor:pointer; font-family:'Libre Franklin',sans-serif;
}
button.submit:disabled{opacity:.5;cursor:default}
.hint{font-size:.75rem;color:var(--ink-soft)}
.err{font-size:.8rem;color:var(--driver);min-height:1em}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:820px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.board{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:10px}
.col-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.swatch{width:11px;height:11px;border-radius:3px;flex:none}
.swatch.driver{background:var(--driver)} .swatch.expressive{background:var(--expressive)}
.swatch.amiable{background:var(--amiable)} .swatch.analytical{background:var(--analytical)}
.col-title{font-family:'Zilla Slab',serif;font-weight:600;font-size:1rem}
.col-count{margin-inline-start:auto;font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.card{
  background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--line);
  border-radius:10px; padding:12px 13px; display:flex; flex-direction:column; gap:8px; overflow-wrap:anywhere;
}
.card.driver{border-inline-start-color:var(--driver)} .card.expressive{border-inline-start-color:var(--expressive)}
.card.amiable{border-inline-start-color:var(--amiable)} .card.analytical{border-inline-start-color:var(--analytical)}
.card.example{border-style:dashed;opacity:.7}
.obj-text{font-family:'Tajawal',sans-serif;direction:rtl;text-align:right;font-size:1rem;line-height:1.5}
.meta-line{font-size:.72rem;color:var(--ink-soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px}
.badge.example{background:transparent;border:1px dashed var(--ink-soft);color:var(--ink-soft)}
.badge.switch{background:var(--analytical-soft);color:var(--analytical)}
.rebuttal{font-size:.82rem;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:7px;font-style:italic}
.rebuttal b{font-style:normal;color:var(--ink)}
.stars{display:flex;gap:2px}
.star{background:none;border:none;cursor:pointer;padding:0;font-size:.95rem;line-height:1;color:var(--line)}
.star:disabled{cursor:default}
.star[data-on="true"]{color:var(--expressive)}
.empty-note{font-size:.78rem;color:var(--ink-soft);padding:6px 2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <a class="brand" href="/">StyleShift</a>
    <h1>Iraqi Objection Bank</h1>
    <p class="sub">Live capture for the Social Style workshop. Write down real objections in Iraqi dialect, tag the style that raised them, note what worked back. Everyone with this link watches the board fill up.</p>
    <div class="status-line"><span class="dot off" id="statusDot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <form class="add" id="addForm">

    <div>
      <span class="hint" style="display:block;margin-bottom:6px;font-weight:600;color:var(--ink)">Social Style</span>
      <div class="styles-row" id="stylesRow">
        <button type="button" class="style-pill" data-style="driver">Driver</button>
        <button type="button" class="style-pill" data-style="expressive">Expressive</button>
        <button type="button" class="style-pill" data-style="amiable">Amiable</button>
        <button type="button" class="style-pill" data-style="analytical">Analytical</button>
      </div>
    </div>

    <label class="field">
      Objection — as said, Iraqi dialect
      <textarea class="ar" id="objText" maxlength="500" placeholder="مثلاً: هذا الدواء غالي وما راح يوصينا بيه المدير..." dir="rtl"></textarea>
    </label>

    <div class="two-col">
      <label class="field">
        Context (product / situation)
        <input type="text" id="context" maxlength="120" placeholder="e.g. cardiology, price objection">
      </label>
      <label class="field">
        Rebuttal that actually worked (optional)
        <input type="text" id="rebuttal" maxlength="300" placeholder="Short line, any language">
      </label>
    </div>

    <div class="row-end">
      <label class="check"><input type="checkbox" id="codeSwitch"> mixes English/MSA pharma terms mid-sentence</label>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="err" id="formErr" role="alert"></span>
        <button type="submit" class="submit" id="submitBtn">Add to board</button>
      </div>
    </div>
  </form>

  <div class="board" id="board"></div>
</div>

<script>
const STYLES = ["driver","expressive","amiable","analytical"];
const STYLE_LABEL = {driver:"Driver",expressive:"Expressive",amiable:"Amiable",analytical:"Analytical"};
const EXAMPLES = {
  driver: {text_ar:"خلص، وريني الأرقام بس. ما عندي وكت لسوالف.", context:"first meeting, time pressure", rebuttal:"Led with the one number that mattered, skipped the intro."},
  expressive: {text_ar:"زين حبيبي بس شوف، كلشي جديد أوله صعب، خلينا نفكر فيها.", context:"new protocol adoption", rebuttal:"Agreed enthusiasm, asked her to co-present to peers."},
  amiable: {text_ar:"ما أريد أخالف رأي الدكتور الثاني، خلي نشوف شرايهم هم.", context:"peer-influenced decision", rebuttal:"Offered a joint call with the peer he trusted."},
  analytical: {text_ar:"وين الدراسة الأصلية؟ هذا الملخص ما يكفي.", context:"evidence request", rebuttal:"Sent the primary study, not just the leave-behind."}
};
const API = "/api/objections";
const POLL_MS = 5000;

let selectedStyle = null;
let liveDocs = [];
const $ = id => document.getElementById(id);


function setActivePill(style){
  selectedStyle = style;
  document.querySelectorAll(".style-pill").forEach(b=>{ b.dataset.active = (b.dataset.style === style) ? "true" : "false"; });
}
$("stylesRow").addEventListener("click", e=>{
  const btn = e.target.closest(".style-pill");
  if(btn) setActivePill(btn.dataset.style);
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderBoard(){
  const board = $("board");
  board.innerHTML = "";
  const byStyle = {driver:[],expressive:[],amiable:[],analytical:[]};
  liveDocs.forEach(d=>{ if(byStyle[d.style]) byStyle[d.style].push(d); });
  STYLES.forEach(style=>{
    const col = document.createElement("div");
    col.className = "col";
    const entries = byStyle[style];
    col.innerHTML = `<div class="col-head"><span class="swatch ${style}"></span><span class="col-title">${STYLE_LABEL[style]}</span><span class="col-count">${entries.length}</span></div>`;
    if(entries.length === 0) col.appendChild(makeCard({...EXAMPLES[style], style, isExample:true, realism:0}));
    else entries.forEach(d=>col.appendChild(makeCard(d)));
    board.appendChild(col);
  });
}

function makeCard(d){
  const card = document.createElement("div");
  card.className = "card " + d.style + (d.isExample ? " example" : "");
  const canRate = !d.isExample;
  const stars = [1,2,3,4,5].map(n=>
    `<button type="button" class="star" data-on="${(d.realism||0) >= n}" data-n="${n}" aria-label="Realism ${n} of 5" ${canRate ? "" : "disabled"}>★</button>`
  ).join("");
  card.innerHTML = `
    <div class="obj-text">${escapeHtml(d.text_ar||"")}</div>
    <div class="meta-line">
      ${d.isExample ? '<span class="badge example">example</span>' : ""}
      ${d.code_switch ? '<span class="badge switch">code-switch</span>' : ""}
      ${d.context ? `<span>${escapeHtml(d.context)}</span>` : ""}
      <span class="stars" title="realism">${stars}</span>
    </div>
    ${d.rebuttal ? `<div class="rebuttal"><b>Worked:</b> ${escapeHtml(d.rebuttal)}</div>` : ""}`;
  if(canRate){
    card.querySelectorAll(".star").forEach(s=>s.addEventListener("click", async ()=>{
      const res = await send({action:"rate", id:d.id, realism:Number(s.dataset.n)});
      if(res.ok){ d.realism = Number(s.dataset.n); renderBoard(); }
    }));
  }
  return card;
}

async function send(body){
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) $("formErr").textContent = j.error || "Could not save — try again.";
    return {ok:r.ok, json:j};
  }catch(e){
    $("formErr").textContent = "No connection — try again.";
    return {ok:false, json:{}};
  }
}

async function load(){
  try{
    const r = await fetch(API, {cache:"no-store"});
    if(!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    liveDocs = j.objections || [];
    $("statusDot").classList.remove("off");
    $("statusText").textContent = "Live — the board refreshes every few seconds.";
    renderBoard();
  }catch(e){
    $("statusDot").classList.add("off");
    $("statusText").textContent = "Can't reach the board — retrying…";
  }
}

$("addForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const errEl = $("formErr");
  errEl.textContent = "";
  if(!selectedStyle){ errEl.textContent = "Pick a Social Style first."; return; }
  const text_ar = $("objText").value.trim();
  if(!text_ar){ errEl.textContent = "Write the objection."; return; }
  const btn = $("submitBtn");
  btn.disabled = true;
  const res = await send({
    action:"add", style:selectedStyle, text_ar,
    context:$("context").value.trim(), rebuttal:$("rebuttal").value.trim(), codeSwitch:$("codeSwitch").checked
  });
  btn.disabled = false;
  if(!res.ok) return;
  liveDocs.unshift(res.json.objection);
  renderBoard();
  $("objText").value = ""; $("context").value = ""; $("rebuttal").value = ""; $("codeSwitch").checked = false;
  setActivePill(null);
});

renderBoard();
load();
setInterval(()=>{ if(document.visibilityState === "visible") load(); }, POLL_MS);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") load(); });
</script>
</body>
</html>
